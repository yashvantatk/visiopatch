<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>k864 9-slice repro</title>
<!-- kaplay.js bundle at 1e1d6ab (parent of 229a9bd7) -->
<!-- 64px panel + 32px margins on each side. -->
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<script src="kaplay.js"></script>
<script>
kaplay({ width: 1280, height: 720, background: "black" });
loadSprite("9slice", "9slice.png", {
    slice9: { left: 32, right: 32, top: 32, bottom: 32 },
});
var g = add([pos(640, 360), anchor("center"), sprite("9slice")]);
onLoad(function () {
    g.width = 64;
    g.height = 64;
});
</script>
</body>
</html>
