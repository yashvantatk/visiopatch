<body>
<script src="kaplay.js"></script>
<script>
kaplay({ width: 1280, height: 720 });
loadSprite("9slice", "9slice.png", {
    slice9: { left: 32, right: 32, top: 32, bottom: 32 },
});
var g = add([pos(center()), sprite("9slice"), anchor("center")]);
onUpdate(function () {
    // Auto-animates (no mouse): buggy anchor renders the slice offset
    var t = time() * 2;
    g.width = 200 + Math.abs(wave(-200, 200, t));
    g.height = 200 + Math.abs(wave(-150, 150, t * 1.3));
});
</script>
