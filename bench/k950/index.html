<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>k950 tall fonts repro (buggy)</title>
<!-- kaplay.js built at buggy_sha 2b07d92 (parent of 231b23f0); fonts from fix commit -->
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<script src="kaplay.js"></script>
<script>
kaplay({ width: 1280, height: 720, background: "#000000", crisp: true });
loadFont("Nabla", "Nabla.ttf", { filter: "nearest" });
loadFont("Anton", "Anton-Regular.ttf", { filter: "nearest" });
add([
    pos(10, 10),
    text("This is a tall font\nThat shouldn't \nget cropped by KAPLAY", {
        font: "Nabla",
        width: 1260,
        size: 48,
        color: rgb(255, 255, 255),
    }),
]);
add([
    pos(10, 400),
    text("This is another tall font\nThat also \nshouldn't get cropped", {
        font: "Anton",
        width: 1260,
        size: 32,
        color: rgb(255, 255, 0),
    }),
]);
</script>
</body>
</html>
